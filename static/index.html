<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101633">
<meta name="referrer" content="no-referrer">
<title>Na dobrou noc</title>
<link rel="icon" href="ikona.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="nebe" aria-hidden="true"></div>

<header class="lista">
  <button id="zpet" class="ikona" hidden aria-label="Zpět">←</button>
  <h1 id="nadpis">🌙 Na dobrou noc</h1>
  <button id="spravaBtn" class="ikona" aria-label="Správa">⚙</button>
</header>

<main id="obsah"></main>

<div id="zpravy" class="zpravy" aria-live="polite"></div>

<!-- Přehrávač: celý kontejner jde na celou obrazovku, aby přechod znělka → díl fullscreen nezrušil -->
<div id="kino" hidden>
  <div id="ytHost"><div id="ytPlayer"></div></div>
  <div id="kinoPanel" class="kino-panel" hidden></div>
  <button id="stop" class="stop" aria-label="Zastavit">✕</button>
</div>

<script src="app.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
